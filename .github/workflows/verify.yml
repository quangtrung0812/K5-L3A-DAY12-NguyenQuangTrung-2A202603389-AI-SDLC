name: Verify Contract & Tests

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build headless and web
        run: npm run build
      - name: Run full verification suite
        run: npm test
